services:
  redbot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REDBOT_VERSION: "3.5.24"
    image: local/redbot:3.5.24
    container_name: redbot
    restart: unless-stopped
    environment:
      TZ: Asia/Dhaka
      HOME: /home/redbot
      BROWSER_PATH: /usr/local/bin/chromium-redbot
      MPLCONFIGDIR: /tmp/matplotlib
    ports:
      - "127.0.0.1:4238:4238"
    volumes:
      - /home/cloud-user/docker/redbot/data:/data:Z
      - /home/cloud-user/docker/redbot/config:/home/redbot/.config/Red-DiscordBot:ro,Z
      - /home/cloud-user/docker/redbot/scripts/chromium-redbot:/usr/local/bin/chromium-redbot:ro,Z
    command:
      - potatosips
      - --owner
      - "REPLACE_WITH_DISCORD_USER_ID"
      - --team-members-are-owners
      - --no-prompt
      - --rpc
    networks:
      - redbot-internal

networks:
  redbot-internal:
    name: redbot-internal

services:
  reddash:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REDDASH_VERSION: "1.8.2"
    image: local/reddash:1.8.2
    container_name: reddash
    restart: unless-stopped
    network_mode: "container:redbot"
    environment:
      TZ: Asia/Dhaka
    command:
      - --port
      - "4238"
      - --rpc-port
      - "6133"
